<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>垃圾車資料健康度</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --unknown: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card: #1e1f26;
      --text: #f0f0f0;
      --muted: #9aa0aa;
      --border: #2c2e37;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    padding: 24px 16px 64px;
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .city-name { font-size: 1.05rem; font-weight: 600; }
  .tier-badge {
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    margin-left: 8px;
  }
  .status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-ok { background: var(--ok); }
  .status-warn { background: var(--warn); }
  .status-bad { background: var(--bad); }
  .status-unknown { background: var(--unknown); }
  .status-label { font-size: 0.85rem; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px 16px;
    margin-top: 12px;
    font-size: 0.85rem;
  }
  .grid dt { color: var(--muted); margin-bottom: 2px; }
  .grid dd { margin: 0; }
  .failure-note {
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--bad);
  }
  .source-link {
    margin-top: 10px;
    font-size: 0.8rem;
  }
  .source-link a { color: inherit; }
  .license-note {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .error-box {
    background: var(--card);
    border: 1px solid var(--bad);
    color: var(--bad);
    border-radius: 12px;
    padding: 16px;
  }
</style>
</head>
<body>
<main>
  <h1>垃圾車資料健康度</h1>
  <p class="subtitle" id="generated-at">載入中...</p>
  <div id="cities"></div>
</main>

<script>
const STATUS_URL = "https://raw.githubusercontent.com/czdzstudio/trash-truck-server/master/data/status.json";
const TIER_LABEL = { 1: "Tier 1・即時定位", 2: "Tier 2・固定班表", 3: "Tier 3・無開放資料", 4: "Tier 4・未支援" };

function timeAgo(iso) {
  if (!iso) return "—";
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.round(diffMs / 60000);
  if (min < 1) return "剛剛";
  if (min < 60) return `${min} 分鐘前`;
  const hr = Math.round(min / 60);
  if (hr < 24) return `${hr} 小時前`;
  return `${Math.round(hr / 24)} 天前`;
}

function fmt(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("zh-TW", { hour12: false });
}

function statusOf(city) {
  const freqMin = city.updateFrequencyMinutes;
  if (city.lastFailureAt && (!city.lastSuccessAt || city.lastFailureAt > city.lastSuccessAt)) {
    return { cls: "bad", label: "同步失敗（顯示的是上一次成功的舊資料）" };
  }
  if (!city.lastSuccessAt) {
    return { cls: "unknown", label: "尚無同步紀錄" };
  }
  if (freqMin) {
    const staleMinutes = (Date.now() - new Date(city.lastSuccessAt).getTime()) / 60000;
    if (staleMinutes > freqMin * 5) {
      return { cls: "warn", label: "資料偏舊，可能排程未正常執行" };
    }
  }
  return { cls: "ok", label: "正常" };
}

function renderCity(code, city) {
  const status = statusOf(city);
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="card-head">
      <div>
        <span class="city-name">${city.cityName ?? code}</span>
        <span class="tier-badge">${TIER_LABEL[city.tier] ?? "未分級"}</span>
      </div>
      <div class="status-label"><span class="status-dot status-${status.cls}"></span>${status.label}</div>
    </div>
    <dl class="grid">
      <div><dt>最後成功同步</dt><dd>${fmt(city.lastSuccessAt)}（${timeAgo(city.lastSuccessAt)}）</dd></div>
      <div><dt>目前資料時間</dt><dd>${fmt(city.latestSourceTime)}</dd></div>
      <div><dt>資料筆數</dt><dd>${city.recordCount ?? "—"}</dd></div>
      <div><dt>預期更新頻率</dt><dd>${city.updateFrequencyMinutes ? city.updateFrequencyMinutes + " 分鐘" : "—"}</dd></div>
    </dl>
    ${city.lastFailureAt ? `<div class="failure-note">最近一次失敗：${fmt(city.lastFailureAt)}（${city.lastFailureReason ?? "未知原因"}）</div>` : ""}
    <div class="source-link">資料出處：<a href="${city.sourceDatasetUrl}" target="_blank" rel="noopener">${city.sourceDatasetUrl ?? "—"}</a></div>
    <div class="license-note">${city.licenseNote ?? ""}</div>
  `;
  return el;
}

async function main() {
  const container = document.getElementById("cities");
  try {
    const res = await fetch(STATUS_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    document.getElementById("generated-at").textContent =
      `狀態資料產生於 ${fmt(data.generatedAt)}（${timeAgo(data.generatedAt)}）`;
    Object.entries(data.cities ?? {}).forEach(([code, city]) => {
      container.appendChild(renderCity(code, city));
    });
  } catch (err) {
    document.getElementById("generated-at").textContent = "";
    const box = document.createElement("div");
    box.className = "error-box";
    box.textContent = `讀取 status.json 失敗：${err.message}`;
    container.appendChild(box);
  }
}

main();
</script>
</body>
</html>
