name: Sync Taipei (台北市固定班表)

on:
  schedule:
    # Fixed schedule data changes rarely (data source is "不定期更新"); once a
    # day is plenty. 18:00 UTC = 02:00 Taipei time, off-peak.
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-taipei
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync, commit and push
        env:
          CITY: taipei
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          node src/sync.js "$CITY"
          SYNC_EXIT=$?
          set -e

          for attempt in 1 2 3 4 5 6 7 8; do
            git add "data/schedule/$CITY.json" data/status.json
            if git diff --staged --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "sync: $CITY $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then
              break
            fi
            echo "Push attempt $attempt failed, re-fetching latest status.json and retrying..."
            git reset --soft HEAD~1
            git fetch origin "$GITHUB_REF_NAME"
            git checkout "origin/$GITHUB_REF_NAME" -- data/status.json
            node src/recordResult.js "$CITY"
            backoff=$((attempt * 3))
            if [ "$backoff" -gt 20 ]; then backoff=20; fi
            sleep $(( (RANDOM % backoff) + 1 ))
            if [ "$attempt" = "8" ]; then
              echo "Failed to push after retries" >&2
              exit 1
            fi
          done

          exit $SYNC_EXIT
