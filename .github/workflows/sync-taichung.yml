name: Sync Taichung (台中市)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-taichung
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # NOTE: the working API endpoint (see src/cities/taichung.js) was recovered
      # from a download link, not the officially documented swagger URL, which no
      # longer resolves. If this job starts failing consistently, check whether
      # the domain moved again before assuming a data format problem.
      - run: node src/sync.js taichung

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime/taichung.json data/status.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync: taichung $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((RANDOM % 10 + 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
