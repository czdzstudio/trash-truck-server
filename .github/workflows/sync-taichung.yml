name: Sync Taichung (台中市)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-taichung
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # NOTE: the working API endpoint (see src/cities/taichung.js) was recovered
      # from a download link, not the officially documented swagger URL, which no
      # longer resolves. If this job starts failing consistently, check whether
      # the domain moved again before assuming a data format problem.
      - name: Sync, commit and push
        env:
          CITY: taichung
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          node src/sync.js "$CITY"
          SYNC_EXIT=$?
          set -e

          for attempt in 1 2 3 4 5; do
            git add "data/realtime/$CITY.json" data/status.json
            if git diff --staged --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "sync: $CITY $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then
              break
            fi
            echo "Push attempt $attempt failed, re-fetching latest status.json and retrying..."
            git reset --soft HEAD~1
            git fetch origin "$GITHUB_REF_NAME"
            git checkout "origin/$GITHUB_REF_NAME" -- data/status.json
            node src/recordResult.js "$CITY"
            sleep $((RANDOM % 8 + 2))
            if [ "$attempt" = "5" ]; then
              echo "Failed to push after retries" >&2
              exit 1
            fi
          done

          exit $SYNC_EXIT
