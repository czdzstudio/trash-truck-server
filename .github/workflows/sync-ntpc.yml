name: Sync NTPC (新北市)

on:
  schedule:
    # Source updates every 2 minutes; 5 minutes is the shortest interval
    # GitHub Actions schedules reliably support.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-ntpc
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node src/sync.js ntpc

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime/ntpc.json data/status.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync: ntpc $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((RANDOM % 10 + 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
